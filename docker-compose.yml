services:
  khushil:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - SAHIL_PASSCODE=${SAHIL_PASSCODE:-1111}
      - KHUSHI_PASSCODE=${KHUSHI_PASSCODE:-2222}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET:-khushil-data}
    volumes:
      - khushil_data:/app/data
volumes:
  khushil_data:
